# Secrets of the test objects: the certificates of the etcd DataStore, the credentials of the PostgreSQL one, and the
# admin kubeconfig of the shop tenant, which the "Download kubeconfig" menu item reads (key admin.conf).
apiVersion: v1
kind: Secret
metadata:
  name: etcd-test-certs
  namespace: kamaji-system
type: Opaque
stringData:
  ca.crt: test-ca-certificate
  ca.key: test-ca-key
  tls.crt: test-client-certificate
  tls.key: test-client-key
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-test-auth
  namespace: kamaji-system
type: Opaque
stringData:
  username: kamaji
  password: test-password
---
apiVersion: v1
kind: Secret
metadata:
  name: shop-admin-kubeconfig
  namespace: kamaji-tenants
type: Opaque
data:
  admin.conf: 
